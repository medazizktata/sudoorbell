name: ci

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck bin/sudo-dialog lib/sudo-dialog.sh libexec/sudo-dialog-askpass libexec/sudo-dialog-prompt shell/sudo-dialog.sh tests/*.sh tests/e2e/linux/*.sh

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: sh tests/run.sh

  e2e-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/e2e/linux/run.sh
