name: ci

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck bin/sudoorbell lib/sudoorbell.sh libexec/sudoorbell-askpass libexec/sudoorbell-prompt shell/sudoorbell.sh tests/*.sh tests/e2e/linux/*.sh tests/e2e/minimal/run.sh

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: sh tests/run.sh

  claude-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate ./claude-code
      - run: claude plugin test claude-code

  e2e-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh tests/e2e/linux/run.sh

  e2e-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh tests/e2e/minimal/run.sh
